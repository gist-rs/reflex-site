<svg xmlns="http://www.w3.org/2000/svg" id="jev-vs-reflex-flow" data-gfflow="1" viewBox="0 0 1462 546" width="1462" height="546" role="img" aria-labelledby="jev-vs-reflex-flow-t jev-vs-reflex-flow-d">
<title id="jev-vs-reflex-flow-t">Two ways to answer the same typed question: Jev hosted, Reflex local</title>
<desc id="jev-vs-reflex-flow-d">8 steps in path order. 1. Your question: the same state + typed questions, either way (your machine; live). 2a. Network hop: every decision crosses the network to their cloud (jev · hosted model; live). 2b. Reflex floor: answers from your corpus in microseconds, over loopback (your machine; live). 3a. One-pass read: a hosted model reads the whole state in one pass (jev · hosted model; live). 3b. If sure: Sure → answer: typed answer + calibrated confidence, back in your app (your machine; live). 3c. If not sure: It abstains: “not sure” + the full distribution attached — it never guesses (your machine; live). 4a. Always answers: typed answer + probabilities, even when unsure (jev · hosted model; live). 4b. If you choose: The hosted head: only abstentions go up — hosted, paid per answer (our hosts; planned · lane opening).</desc>
<style>#jev-vs-reflex-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#jev-vs-reflex-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#jev-vs-reflex-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#jev-vs-reflex-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#jev-vs-reflex-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#jev-vs-reflex-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#jev-vs-reflex-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#jev-vs-reflex-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#jev-vs-reflex-flow .e{fill:none;stroke-width:1.6}#jev-vs-reflex-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="jev-vs-reflex-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1462" height="546" rx="14" fill="#11141b"/>
<g data-lane="jev"><rect x="10" y="12" width="1442" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#5cc8e8">JEV · HOSTED MODEL</tspan><tspan class="ln" dx="12">their cloud · a network round-trip every decision</tspan></text></g>
<g data-aside="jev"><text x="30" y="72" class="at">Always answers</text><text x="30" y="96" class="d">even when unsure — thresholding</text><text x="30" y="115" class="d">the probabilities is your job.</text></g>
<g data-lane="me"><rect x="10" y="190" width="1442" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">YOUR MACHINE</tspan><tspan class="ln" dx="12">local · free · private</tspan></text></g>
<g data-lane="host"><rect x="10" y="368" width="1442" height="166" rx="16" fill="#a98bfa" fill-opacity=".06" stroke="#a98bfa" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#a98bfa">OUR HOSTS</tspan><tspan class="ln" dx="12">managed · paid per answer</tspan></text></g>
