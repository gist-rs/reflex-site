<svg xmlns="http://www.w3.org/2000/svg" id="jev-vs-reflex-flow-m" data-gfflow="1" viewBox="0 0 340 1174" width="340" height="1174" role="img" aria-labelledby="jev-vs-reflex-flow-m-t jev-vs-reflex-flow-m-d">
<title id="jev-vs-reflex-flow-m-t">Two ways to answer the same typed question: Jev hosted, Reflex local</title>
<desc id="jev-vs-reflex-flow-m-d">8 steps in path order. 1. Your question: the same state + typed questions, either way (your machine; live). 2a. Network hop: every decision crosses the network to their cloud (jev · hosted model; live). 2b. Reflex floor: answers from your corpus in microseconds, over loopback (your machine; live). 3a. One-pass read: a hosted model reads the whole state in one pass (jev · hosted model; live). 3b. If sure: Sure → answer: typed answer + calibrated confidence, back in your app (your machine; live). 3c. If not sure: It abstains: “not sure” + the full distribution attached — it never guesses (your machine; live). 4a. Always answers: typed answer + probabilities, even when unsure (jev · hosted model; live). 4b. If you choose: The hosted head: only abstentions go up — hosted, paid per answer (our hosts; planned · lane opening).</desc>
<style>#jev-vs-reflex-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#jev-vs-reflex-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#jev-vs-reflex-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#jev-vs-reflex-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#jev-vs-reflex-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#jev-vs-reflex-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#jev-vs-reflex-flow-m .e{fill:none;stroke-width:1.6}</style>
