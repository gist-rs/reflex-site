<rect width="340" height="1174" rx="14" fill="#11141b"/>
<g data-step="ask" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="118" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="94" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Your question</text><text x="22" y="80" class="d">the same state + typed questions, either way</text><rect x="22" y="92" width="49.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="106" class="el">→ 2a</text><rect x="77.6" y="92" width="49.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="85.6" y="106" class="el">→ 2b</text></g>
<g data-edge="ask->jev_trip"><path class="e" d="M44,126 V166" stroke="#69718a" marker-end="url(#jev-vs-reflex-flow-m-a0)"/>
</g>
<g data-step="jev_trip" data-n="2a"><rect class="gf-cb" x="4" y="166" width="332" height="104" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="178" width="4" height="80" rx="2" fill="#5cc8e8"/><text x="22" y="188" class="k" fill="#5cc8e8">JEV · HOSTED MODEL</text><circle cx="280.2" cy="184" r="3.5" fill="#4ade80"/><text x="318" y="188" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="198" width="29.6" height="22" rx="11" fill="#5cc8e8"/><text x="36.8" y="213.5" text-anchor="middle" class="n">2a</text><text x="61.6" y="214" class="t">Network hop</text><text x="22" y="238" class="d">every decision crosses the network to their</text><text x="22" y="256" class="d">cloud</text></g>
<g data-edge="ask->floor"><path class="e" d="M44,276 V304" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="294">↳ from 1</text></g>
<g data-step="floor" data-n="2b"><rect class="gf-cb" x="4" y="310" width="332" height="136" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="322" width="4" height="112" rx="2" fill="#ff8a3d"/><text x="22" y="332" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="328" r="3.5" fill="#4ade80"/><text x="318" y="332" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="342" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="357.5" text-anchor="middle" class="n">2b</text><text x="62.4" y="358" class="t">Reflex floor</text><text x="22" y="382" class="d">answers from your corpus in microseconds,</text><text x="22" y="400" class="d">over loopback</text><rect x="22" y="412" width="104.8" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="426" class="el">→ 3b · sure</text><rect x="132.8" y="412" width="133.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="140.8" y="426" class="el">→ 3c · not sure</text></g>
<g data-edge="jev_trip->jev_read"><path class="e" d="M44,452 V480" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="470">↳ from 2a</text></g>
<g data-step="jev_read" data-n="3a"><rect class="gf-cb" x="4" y="486" width="332" height="104" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="498" width="4" height="80" rx="2" fill="#5cc8e8"/><text x="22" y="508" class="k" fill="#5cc8e8">JEV · HOSTED MODEL</text><circle cx="280.2" cy="504" r="3.5" fill="#4ade80"/><text x="318" y="508" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="518" width="29.6" height="22" rx="11" fill="#5cc8e8"/><text x="36.8" y="533.5" text-anchor="middle" class="n">3a</text><text x="61.6" y="534" class="t">One-pass read</text><text x="22" y="558" class="d">a hosted model reads the whole state in one</text><text x="22" y="576" class="d">pass</text></g>
<g data-edge="floor->sure"><path class="e" d="M44,596 V624" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="614">↳ from 2b · sure</text></g>
<g data-step="sure" data-n="3b"><rect class="gf-cb" x="4" y="630" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="642" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="652" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="648" r="3.5" fill="#4ade80"/><text x="318" y="652" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="662" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="677.5" text-anchor="middle" class="n">3b</text><text x="62.4" y="678" class="t">Sure → answer</text><text x="22" y="702" class="d">typed answer + calibrated confidence, back in</text><text x="22" y="720" class="d">your app</text></g>
<g data-edge="floor->abstain"><path class="e" d="M44,740 V768" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="758">↳ from 2b · not sure</text></g>
<g data-step="abstain" data-n="3c"><rect class="gf-cb" x="4" y="774" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="786" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="796" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="792" r="3.5" fill="#4ade80"/><text x="318" y="796" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="806" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="821.5" text-anchor="middle" class="n">3c</text><text x="61.6" y="822" class="t">It abstains</text><text x="22" y="846" class="d">“not sure” + the full distribution attached — it</text><text x="22" y="864" class="d">never guesses</text></g>
<g data-edge="jev_read->jev_answer"><path class="e" d="M44,884 V912" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="902">↳ from 3a</text></g>
<g data-step="jev_answer" data-n="4a"><rect class="gf-cb" x="4" y="918" width="332" height="104" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="930" width="4" height="80" rx="2" fill="#5cc8e8"/><text x="22" y="940" class="k" fill="#5cc8e8">JEV · HOSTED MODEL</text><circle cx="280.2" cy="936" r="3.5" fill="#4ade80"/><text x="318" y="940" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="950" width="29.6" height="22" rx="11" fill="#5cc8e8"/><text x="36.8" y="965.5" text-anchor="middle" class="n">4a</text><text x="61.6" y="966" class="t">Always answers</text><text x="22" y="990" class="d">typed answer + probabilities, even when</text><text x="22" y="1008" class="d">unsure</text></g>
