<svg xmlns="http://www.w3.org/2000/svg" id="model-classes-flow-m" data-gfflow="1" viewBox="0 0 340 1644" width="340" height="1644" role="img" aria-labelledby="model-classes-flow-m-t model-classes-flow-m-d">
<title id="model-classes-flow-m-t">Three ways a typed question becomes an answer</title>
<desc id="model-classes-flow-m-d">10 steps in path order. 1. A typed question: state + questions + options, asked on your machine (modelless · your machine; live). 2a.1. Hash the words: words and pairs become counts; order is lost (modelless · your machine; live). 2a.2. Score + abstain: sigmoid score per option vs your corpus (modelless · your machine; live). 2b.1. If encoder: One forward pass: question AND every option read together (encoder · our gpu hosts; live). 2b.2. Both directions: every token attends left AND right (encoder · our gpu hosts; live). 2b.3. A small head: a tiny trained layer turns the reading into option scores (encoder · our gpu hosts; live · on the board). 2c.1. If chatbot: Read the prompt: one pass over everything so far (autoregressive · a chatbot; live). 2c.2. Predict a token: each token sees only the past — the causal mask (autoregressive · a chatbot; live). 2c.3. If next: Append, repeat: generation is a loop, one token per pass (autoregressive · a chatbot; live). 3. If µs-class / ms-class / parse the text: One typed answer: probabilities + confidence — or an honest abstain (modelless · your machine; live). From 2c.3 back to 2c.2: loop.</desc>
<style>#model-classes-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#model-classes-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#model-classes-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#model-classes-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#model-classes-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#model-classes-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#model-classes-flow-m .e{fill:none;stroke-width:1.6}</style>
