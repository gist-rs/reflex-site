<svg xmlns="http://www.w3.org/2000/svg" id="train-freeze-flow" data-gfflow="1" viewBox="0 0 2050 724" width="2050" height="724" role="img" aria-labelledby="train-freeze-flow-t train-freeze-flow-d">
<title id="train-freeze-flow-t">Frozen below, trained above — how a student head is built</title>
<desc id="train-freeze-flow-d">7 steps in path order. 1. A labeled corpus: public data, frozen splits; the test split is read once (public data + big models; live). 2. If every example: The frozen encoder: reads every example once; its weights never train (the frozen encoder; live). 3. If cached features: Fit the small head: on gold labels, or a frozen teacher&#x27;s probabilities (the trainable top; live). 4. Earn the read: the fit must clear its bar on held-out examples (the trainable top; live). 5. If one read: One frozen test read: the winner law: serve only a strict win (your machine · the gate; live). 6. Lock, never blend: the winner swaps in whole; losers are demoted (your machine · the gate; live). 7. Serve composed: the floor answers first; the head thinks on abstain (your machine · the gate; live · open today).</desc>
<style>#train-freeze-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#train-freeze-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#train-freeze-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#train-freeze-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#train-freeze-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#train-freeze-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#train-freeze-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#train-freeze-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#train-freeze-flow .e{fill:none;stroke-width:1.6}#train-freeze-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="train-freeze-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="2050" height="724" rx="14" fill="#11141b"/>
<g data-lane="data"><rect x="10" y="12" width="2030" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#5cc8e8">PUBLIC DATA + BIG MODELS</tspan><tspan class="ln" dx="12">the corpus and the frozen teacher</tspan></text></g>
<g data-lane="froz"><rect x="10" y="190" width="2030" height="166" rx="16" fill="#a98bfa" fill-opacity=".06" stroke="#a98bfa" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#a98bfa">THE FROZEN ENCODER</tspan><tspan class="ln" dx="12">our substrate — its weights never train</tspan></text></g>
<g data-aside="froz"><text x="30" y="250" class="at">Frozen means frozen</text><text x="30" y="274" class="d">the encoder&#x27;s weights are locked</text><text x="30" y="293" class="d">bytes — one reading of a text,</text><text x="30" y="312" class="d">exact and repeatable, forever.</text></g>
<g data-lane="fit"><rect x="10" y="368" width="2030" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#f472b6">THE TRAINABLE TOP</tspan><tspan class="ln" dx="12">a small head — cheap to fit per domain</tspan></text></g>
<g data-aside="fit"><text x="30" y="428" class="at">The only part we train</text><text x="30" y="452" class="d">a tiny head — small enough to fit</text><text x="30" y="471" class="d">per domain without a GPU farm,</text><text x="30" y="490" class="d">locked the moment it wins.</text></g>
<g data-lane="you"><rect x="10" y="546" width="2030" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="571"><tspan class="lh" fill="#ff8a3d">YOUR MACHINE · THE GATE</tspan><tspan class="ln" dx="12">the winner law and the serve</tspan></text></g>
<g data-aside="you"><text x="30" y="606" class="at">The discipline</text><text x="30" y="630" class="d">one frozen test read, a strict-win</text><text x="30" y="649" class="d">gate, lock and swap whole —</text><text x="30" y="668" class="d">never blend.</text></g>
<g data-edge="corpus->cache"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#train-freeze-flow-a0)"/><text class="el" x="349.5" y="99" text-anchor="middle">every example</text></g>
<g data-edge="cache->train"><path class="e" d="M554,286 733,286 733,410" stroke="#69718a" marker-end="url(#train-freeze-flow-a0)"/><text class="el" x="643.5" y="277" text-anchor="middle">cached features</text></g>
<g data-edge="train->hold"><path class="e" d="M848,464 912,464" stroke="#69718a" marker-end="url(#train-freeze-flow-a0)"/></g>
<g data-edge="hold->read"><path class="e" d="M1142,464 1321,464 1321,588" stroke="#69718a" marker-end="url(#train-freeze-flow-a0)"/><text class="el" x="1231.5" y="455" text-anchor="middle">one read</text></g>
<g data-edge="read->lock"><path class="e" d="M1436,642 1500,642" stroke="#69718a" marker-end="url(#train-freeze-flow-a0)"/></g>
<g data-edge="lock->serve"><path class="e" d="M1730,642 1794,642" stroke="#69718a" marker-end="url(#train-freeze-flow-a0)"/></g>
<g data-step="corpus" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#5cc8e8"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">A labeled corpus</text><text x="46" y="109" class="d">public data, frozen splits; the</text><text x="46" y="128" class="d">test split is read once</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="cache" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#a98bfa"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">The frozen encoder</text><text x="340" y="287" class="d">reads every example once; its</text><text x="340" y="306" class="d">weights never train</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="train" data-n="3"><rect class="gf-cb" x="618" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="640" cy="434" r="12" fill="#f472b6"/><text x="640" y="438.5" text-anchor="middle" class="n">3</text><text x="662" y="439" class="t">Fit the small head</text><text x="634" y="465" class="d">on gold labels, or a frozen</text><text x="634" y="484" class="d">teacher&#x27;s probabilities</text><circle cx="638" cy="502" r="4" fill="#4ade80"/><text x="648" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="hold" data-n="4"><rect class="gf-cb" x="912" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="934" cy="434" r="12" fill="#f472b6"/><text x="934" y="438.5" text-anchor="middle" class="n">4</text><text x="956" y="439" class="t">Earn the read</text><text x="928" y="465" class="d">the fit must clear its bar on</text><text x="928" y="484" class="d">held-out examples</text><circle cx="932" cy="502" r="4" fill="#4ade80"/><text x="942" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="read" data-n="5"><rect class="gf-cb" x="1206" y="588" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="1228" cy="612" r="12" fill="#ff8a3d"/><text x="1228" y="616.5" text-anchor="middle" class="n">5</text><text x="1250" y="617" class="t">One frozen test read</text><text x="1222" y="643" class="d">the winner law: serve only a</text><text x="1222" y="662" class="d">strict win</text><circle cx="1226" cy="680" r="4" fill="#4ade80"/><text x="1236" y="684" class="s" fill="#4ade80">live</text></g>
<g data-step="lock" data-n="6"><rect class="gf-cb" x="1500" y="588" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="1522" cy="612" r="12" fill="#ff8a3d"/><text x="1522" y="616.5" text-anchor="middle" class="n">6</text><text x="1544" y="617" class="t">Lock, never blend</text><text x="1516" y="643" class="d">the winner swaps in whole;</text><text x="1516" y="662" class="d">losers are demoted</text><circle cx="1520" cy="680" r="4" fill="#4ade80"/><text x="1530" y="684" class="s" fill="#4ade80">live</text></g>
<g data-step="serve" data-n="7"><rect class="gf-cb" x="1794" y="588" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="1816" cy="612" r="12" fill="#ff8a3d"/><text x="1816" y="616.5" text-anchor="middle" class="n">7</text><text x="1838" y="617" class="t">Serve composed</text><text x="1810" y="643" class="d">the floor answers first; the</text><text x="1810" y="662" class="d">head thinks on abstain</text><circle cx="1814" cy="680" r="4" fill="#4ade80"/><text x="1824" y="684" class="s" fill="#4ade80">live · open today</text></g>
</svg>
