<rect width="1756" height="546" rx="14" fill="#11141b"/>
<g data-lane="floor"><rect x="10" y="12" width="1736" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">THE FREE FLOOR</tspan><tspan class="ln" dx="12">Reflex · your machine</tspan></text></g>
<g data-lane="bag"><rect x="10" y="190" width="1736" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#f472b6">THE SPECIALIST RUNG</tspan><tspan class="ln" dx="12">the open lane · CPU</tspan></text></g>
<g data-lane="enc"><rect x="10" y="368" width="1736" height="166" rx="16" fill="#a98bfa" fill-opacity=".06" stroke="#a98bfa" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#a98bfa">THE ENCODER RUNG</tspan><tspan class="ln" dx="12">our GPU hosts · HOSTED-ONLY</tspan></text></g>
