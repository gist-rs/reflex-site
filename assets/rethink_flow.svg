<g data-step="ans" data-n="3a"><rect class="gf-cb" x="618" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="628" y="66" width="29.6" height="24" rx="12" fill="#ff8a3d"/><text x="642.8" y="82.5" text-anchor="middle" class="n">3a</text><text x="667.6" y="83" class="t">Answer + receipt</text><text x="634" y="109" class="d">microseconds, your machine,</text><text x="634" y="128" class="d">nothing leaves</text><circle cx="638" cy="146" r="4" fill="#4ade80"/><text x="648" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="spec" data-n="3b.1"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="628" y="244" width="42.1" height="24" rx="12" fill="#f472b6"/><text x="649" y="260.5" text-anchor="middle" class="n">3b.1</text><text x="680.1" y="261" class="t">The bag rung</text><text x="634" y="287" class="d">hashed-bag specialists score</text><text x="634" y="306" class="d">the survivors, CPU-class</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
