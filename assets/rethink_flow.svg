<g data-edge="vsl->think"><path class="eb" d="M1500,464 1142,464" stroke="#a98bfa" marker-end="url(#rethink-flow-a2)"/><text class="el" x="1321" y="455" text-anchor="middle" style="fill:#a98bfa">holds the head</text></g>
