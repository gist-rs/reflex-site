<g data-edge="gate->spec"><path class="e" d="M439,162 439,286 618,286" stroke="#69718a" marker-end="url(#rethink-flow-a0)"/><text class="el" x="528.5" y="277" text-anchor="middle">not sure → abstains</text></g>
<g data-edge="spec->think"><path class="e" d="M848,286 988.7,286 988.7,410" stroke="#69718a" marker-end="url(#rethink-flow-a0)"/><text class="el" x="918.3" y="277" text-anchor="middle">too coarse</text></g>
