<svg xmlns="http://www.w3.org/2000/svg" id="model-classes-flow" data-gfflow="1" viewBox="0 0 1462 546" width="1462" height="546" role="img" aria-labelledby="model-classes-flow-t model-classes-flow-d">
<title id="model-classes-flow-t">Three ways a typed question becomes an answer</title>
<desc id="model-classes-flow-d">10 steps in path order. 1. A typed question: state + questions + options, asked on your machine (modelless · your machine; live). 2a.1. Hash the words: words and pairs become counts; order is lost (modelless · your machine; live). 2a.2. Score + abstain: sigmoid score per option vs your corpus (modelless · your machine; live). 2b.1. If encoder: One forward pass: question AND every option read together (encoder · our gpu hosts; live). 2b.2. Both directions: every token attends left AND right (encoder · our gpu hosts; live). 2b.3. A small head: a tiny trained layer turns the reading into option scores (encoder · our gpu hosts; live · on the board). 2c.1. If chatbot: Read the prompt: one pass over everything so far (autoregressive · a chatbot; live). 2c.2. Predict a token: each token sees only the past — the causal mask (autoregressive · a chatbot; live). 2c.3. If next: Append, repeat: generation is a loop, one token per pass (autoregressive · a chatbot; live). 3. If µs-class / ms-class / parse the text: One typed answer: probabilities + confidence — or an honest abstain (modelless · your machine; live). From 2c.3 back to 2c.2: loop.</desc>
<style>#model-classes-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#model-classes-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#model-classes-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#model-classes-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#model-classes-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#model-classes-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#model-classes-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#model-classes-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#model-classes-flow .e{fill:none;stroke-width:1.6}#model-classes-flow .eb{fill:none;stroke-width:2}</style>
