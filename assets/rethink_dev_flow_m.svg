<svg xmlns="http://www.w3.org/2000/svg" id="rethink-dev-flow-m" data-gfflow="1" viewBox="0 0 340 642" width="340" height="642" role="img" aria-labelledby="rethink-dev-flow-m-t rethink-dev-flow-m-d">
<title id="rethink-dev-flow-m-t">Rethink: how a hosted head is made, locked, minted and served</title>
<desc id="rethink-dev-flow-m-d">5 steps in path order. 1. Train the head: a small trained head above a frozen base (trainer; live). 2. Lock it: hashed and checksum-verified — tamper-evident (trainer; live). 3. Mint the vessel: one HOSTED-ONLY file; weights never leave us (our gpu hosts; planned). 4. Deploy: our GPU hosts only, one container shape (our gpu hosts; planned). 5. The storefront: you call, we think — receipts on answers (our gpu hosts; planned).</desc>
<style>#rethink-dev-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#rethink-dev-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#rethink-dev-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#rethink-dev-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#rethink-dev-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#rethink-dev-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#rethink-dev-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="rethink-dev-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="642" rx="14" fill="#11141b"/>
<g data-step="train" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#a98bfa"/><text x="22" y="30" class="k" fill="#a98bfa">TRAINER · THE HEAD IS TRAINED</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#a98bfa"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Train the head</text><text x="22" y="80" class="d">a small trained head above a frozen base</text></g>
<g data-edge="train->lock"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#rethink-dev-flow-m-a0)"/>
</g>
<g data-step="lock" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="104" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="80" rx="2" fill="#a98bfa"/><text x="22" y="156" class="k" fill="#a98bfa">TRAINER · THE HEAD IS TRAINED</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#a98bfa"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Lock it</text><text x="22" y="206" class="d">hashed and checksum-verified —</text><text x="22" y="224" class="d">tamper-evident</text></g>
<g data-edge="lock->mint"><path class="e" d="M44,238 V278" stroke="#69718a" marker-end="url(#rethink-dev-flow-m-a0)"/>
</g>
<g data-step="mint" data-n="3"><rect class="gf-cb" x="4" y="278" width="332" height="104" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="290" width="4" height="80" rx="2" fill="#a98bfa"/><text x="22" y="300" class="k" fill="#a98bfa">OUR GPU HOSTS · HOSTED-ONLY</text><circle cx="258.6" cy="296" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="300" text-anchor="end" class="s" fill="#9299ab">planned</text><circle cx="33" cy="321" r="11" fill="#a98bfa"/><text x="33" y="325.5" text-anchor="middle" class="n">3</text><text x="54" y="326" class="t">Mint the vessel</text><text x="22" y="350" class="d">one HOSTED-ONLY file; weights never leave</text><text x="22" y="368" class="d">us</text></g>
<g data-edge="mint->deploy"><path class="e" d="M44,382 V422" stroke="#69718a" marker-end="url(#rethink-dev-flow-m-a0)"/>
</g>
<g data-step="deploy" data-n="4"><rect class="gf-cb" x="4" y="422" width="332" height="86" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="434" width="4" height="62" rx="2" fill="#a98bfa"/><text x="22" y="444" class="k" fill="#a98bfa">OUR GPU HOSTS · HOSTED-ONLY</text><circle cx="258.6" cy="440" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="444" text-anchor="end" class="s" fill="#9299ab">planned</text><circle cx="33" cy="465" r="11" fill="#a98bfa"/><text x="33" y="469.5" text-anchor="middle" class="n">4</text><text x="54" y="470" class="t">Deploy</text><text x="22" y="494" class="d">our GPU hosts only, one container shape</text></g>
<g data-edge="deploy->store"><path class="e" d="M44,508 V548" stroke="#69718a" marker-end="url(#rethink-dev-flow-m-a0)"/>
</g>
<g data-step="store" data-n="5"><rect class="gf-cb" x="4" y="548" width="332" height="86" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="560" width="4" height="62" rx="2" fill="#a98bfa"/><text x="22" y="570" class="k" fill="#a98bfa">OUR GPU HOSTS · HOSTED-ONLY</text><circle cx="258.6" cy="566" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="570" text-anchor="end" class="s" fill="#9299ab">planned</text><circle cx="33" cy="591" r="11" fill="#a98bfa"/><text x="33" y="595.5" text-anchor="middle" class="n">5</text><text x="54" y="596" class="t">The storefront</text><text x="22" y="620" class="d">you call, we think — receipts on answers</text></g>
</svg>
