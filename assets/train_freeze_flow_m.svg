<svg xmlns="http://www.w3.org/2000/svg" id="train-freeze-flow-m" data-gfflow="1" viewBox="0 0 340 1084" width="340" height="1084" role="img" aria-labelledby="train-freeze-flow-m-t train-freeze-flow-m-d">
<title id="train-freeze-flow-m-t">Frozen below, trained above — how a student head is built</title>
<desc id="train-freeze-flow-m-d">7 steps in path order. 1. A labeled corpus: public data, frozen splits; the test split is read once (public data + big models; live). 2. If every example: The frozen encoder: reads every example once; its weights never train (the frozen encoder; live). 3. If cached features: Fit the small head: on gold labels, or a frozen teacher&#x27;s probabilities (the trainable top; live). 4. Earn the read: the fit must clear its bar on held-out examples (the trainable top; live). 5. If one read: One frozen test read: the winner law: serve only a strict win (your machine · the gate; live). 6. Lock, never blend: the winner swaps in whole; losers are demoted (your machine · the gate; live). 7. Serve composed: the floor answers first; the head thinks on abstain (your machine · the gate; live · open today).</desc>
<style>#train-freeze-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#train-freeze-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#train-freeze-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#train-freeze-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#train-freeze-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#train-freeze-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#train-freeze-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="train-freeze-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="1084" rx="14" fill="#11141b"/>
<g data-step="corpus" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="126" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="102" rx="2" fill="#5cc8e8"/><text x="22" y="30" class="k" fill="#5cc8e8">PUBLIC DATA + BIG MODELS · THE CORPUS AND THE FROZEN TEACHER</text><circle cx="33" cy="51" r="11" fill="#5cc8e8"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">A labeled corpus</text><text x="22" y="80" class="d">public data, frozen splits; the test split is read</text><text x="22" y="98" class="d">once</text><circle cx="26" cy="116" r="3.5" fill="#4ade80"/><text x="35" y="120" class="s" fill="#4ade80">live</text></g>
<g data-edge="corpus->cache"><path class="e" d="M44,134 V174" stroke="#69718a" marker-end="url(#train-freeze-flow-m-a0)"/>
<text class="el" x="56" y="158">every example</text>
</g>
<g data-step="cache" data-n="2"><rect class="gf-cb" x="4" y="174" width="332" height="126" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="186" width="4" height="102" rx="2" fill="#a98bfa"/><text x="22" y="196" class="k" fill="#a98bfa">THE FROZEN ENCODER · OUR SUBSTRATE — ITS WEIGHTS NEVER TRAIN</text><circle cx="33" cy="217" r="11" fill="#a98bfa"/><text x="33" y="221.5" text-anchor="middle" class="n">2</text><text x="54" y="222" class="t">The frozen encoder</text><text x="22" y="246" class="d">reads every example once; its weights never</text><text x="22" y="264" class="d">train</text><circle cx="26" cy="282" r="3.5" fill="#4ade80"/><text x="35" y="286" class="s" fill="#4ade80">live</text></g>
<g data-edge="cache->train"><path class="e" d="M44,300 V340" stroke="#69718a" marker-end="url(#train-freeze-flow-m-a0)"/>
<text class="el" x="56" y="324">cached features</text>
</g>
<g data-step="train" data-n="3"><rect class="gf-cb" x="4" y="340" width="332" height="126" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="352" width="4" height="102" rx="2" fill="#f472b6"/><text x="22" y="362" class="k" fill="#f472b6">THE TRAINABLE TOP · A SMALL HEAD — CHEAP TO FIT PER DOMAIN</text><circle cx="33" cy="383" r="11" fill="#f472b6"/><text x="33" y="387.5" text-anchor="middle" class="n">3</text><text x="54" y="388" class="t">Fit the small head</text><text x="22" y="412" class="d">on gold labels, or a frozen teacher&#x27;s</text><text x="22" y="430" class="d">probabilities</text><circle cx="26" cy="448" r="3.5" fill="#4ade80"/><text x="35" y="452" class="s" fill="#4ade80">live</text></g>
<g data-edge="train->hold"><path class="e" d="M44,466 V506" stroke="#69718a" marker-end="url(#train-freeze-flow-m-a0)"/>
</g>
<g data-step="hold" data-n="4"><rect class="gf-cb" x="4" y="506" width="332" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="518" width="4" height="84" rx="2" fill="#f472b6"/><text x="22" y="528" class="k" fill="#f472b6">THE TRAINABLE TOP · A SMALL HEAD — CHEAP TO FIT PER DOMAIN</text><circle cx="33" cy="549" r="11" fill="#f472b6"/><text x="33" y="553.5" text-anchor="middle" class="n">4</text><text x="54" y="554" class="t">Earn the read</text><text x="22" y="578" class="d">the fit must clear its bar on held-out examples</text><circle cx="26" cy="596" r="3.5" fill="#4ade80"/><text x="35" y="600" class="s" fill="#4ade80">live</text></g>
<g data-edge="hold->read"><path class="e" d="M44,614 V654" stroke="#69718a" marker-end="url(#train-freeze-flow-m-a0)"/>
<text class="el" x="56" y="638">one read</text>
</g>
<g data-step="read" data-n="5"><rect class="gf-cb" x="4" y="654" width="332" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="666" width="4" height="84" rx="2" fill="#ff8a3d"/><text x="22" y="676" class="k" fill="#ff8a3d">YOUR MACHINE · THE GATE · THE WINNER LAW AND THE SERVE</text><circle cx="33" cy="697" r="11" fill="#ff8a3d"/><text x="33" y="701.5" text-anchor="middle" class="n">5</text><text x="54" y="702" class="t">One frozen test read</text><text x="22" y="726" class="d">the winner law: serve only a strict win</text><circle cx="26" cy="744" r="3.5" fill="#4ade80"/><text x="35" y="748" class="s" fill="#4ade80">live</text></g>
<g data-edge="read->lock"><path class="e" d="M44,762 V802" stroke="#69718a" marker-end="url(#train-freeze-flow-m-a0)"/>
</g>
<g data-step="lock" data-n="6"><rect class="gf-cb" x="4" y="802" width="332" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="814" width="4" height="84" rx="2" fill="#ff8a3d"/><text x="22" y="824" class="k" fill="#ff8a3d">YOUR MACHINE · THE GATE · THE WINNER LAW AND THE SERVE</text><circle cx="33" cy="845" r="11" fill="#ff8a3d"/><text x="33" y="849.5" text-anchor="middle" class="n">6</text><text x="54" y="850" class="t">Lock, never blend</text><text x="22" y="874" class="d">the winner swaps in whole; losers are demoted</text><circle cx="26" cy="892" r="3.5" fill="#4ade80"/><text x="35" y="896" class="s" fill="#4ade80">live</text></g>
<g data-edge="lock->serve"><path class="e" d="M44,910 V950" stroke="#69718a" marker-end="url(#train-freeze-flow-m-a0)"/>
</g>
<g data-step="serve" data-n="7"><rect class="gf-cb" x="4" y="950" width="332" height="126" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="962" width="4" height="102" rx="2" fill="#ff8a3d"/><text x="22" y="972" class="k" fill="#ff8a3d">YOUR MACHINE · THE GATE · THE WINNER LAW AND THE SERVE</text><circle cx="33" cy="993" r="11" fill="#ff8a3d"/><text x="33" y="997.5" text-anchor="middle" class="n">7</text><text x="54" y="998" class="t">Serve composed</text><text x="22" y="1022" class="d">the floor answers first; the head thinks on</text><text x="22" y="1040" class="d">abstain</text><circle cx="26" cy="1058" r="3.5" fill="#4ade80"/><text x="35" y="1062" class="s" fill="#4ade80">live · open today</text></g>
</svg>
