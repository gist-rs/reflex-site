<svg xmlns="http://www.w3.org/2000/svg" id="rethink-dev-flow" data-gfflow="1" viewBox="0 0 1462 368" width="1462" height="368" role="img" aria-labelledby="rethink-dev-flow-t rethink-dev-flow-d">
<title id="rethink-dev-flow-t">Rethink: how a hosted head is made, locked, minted and served</title>
<desc id="rethink-dev-flow-d">5 steps in path order. 1. Train the head: a small trained head above a frozen base (trainer; live). 2. Lock it: hashed and checksum-verified — tamper-evident (trainer; live). 3. Mint the vessel: one HOSTED-ONLY file; weights never leave us (our gpu hosts; planned). 4. Deploy: our GPU hosts only, one container shape (our gpu hosts; planned). 5. The storefront: you call, we think — receipts on answers (our gpu hosts; planned).</desc>
<style>#rethink-dev-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#rethink-dev-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#rethink-dev-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#rethink-dev-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#rethink-dev-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#rethink-dev-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#rethink-dev-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#rethink-dev-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#rethink-dev-flow .e{fill:none;stroke-width:1.6}#rethink-dev-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="rethink-dev-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1462" height="368" rx="14" fill="#11141b"/>
<g data-lane="trainer"><rect x="10" y="12" width="1442" height="166" rx="16" fill="#a98bfa" fill-opacity=".06" stroke="#a98bfa" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#a98bfa">TRAINER</tspan><tspan class="ln" dx="12">the head is trained</tspan></text></g>
<g data-lane="hosts"><rect x="10" y="190" width="1442" height="166" rx="16" fill="#a98bfa" fill-opacity=".06" stroke="#a98bfa" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#a98bfa">OUR GPU HOSTS</tspan><tspan class="ln" dx="12">HOSTED-ONLY · weights never leave</tspan></text></g>
<g data-edge="train->lock"><path class="e" d="M260,108 324,108" stroke="#69718a" marker-end="url(#rethink-dev-flow-a0)"/></g>
<g data-edge="lock->mint"><path class="e" d="M554,108 733,108 733,232" stroke="#69718a" marker-end="url(#rethink-dev-flow-a0)"/></g>
<g data-edge="mint->deploy"><path class="e" d="M848,286 912,286" stroke="#69718a" marker-end="url(#rethink-dev-flow-a0)"/></g>
<g data-edge="deploy->store"><path class="e" d="M1142,286 1206,286" stroke="#69718a" marker-end="url(#rethink-dev-flow-a0)"/></g>
<g data-step="train" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#a98bfa"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Train the head</text><text x="46" y="109" class="d">a small trained head above a</text><text x="46" y="128" class="d">frozen base</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="lock" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#a98bfa"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">Lock it</text><text x="340" y="109" class="d">hashed and checksum-verified</text><text x="340" y="128" class="d">— tamper-evident</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="mint" data-n="3"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="640" cy="256" r="12" fill="#a98bfa"/><text x="640" y="260.5" text-anchor="middle" class="n">3</text><text x="662" y="261" class="t">Mint the vessel</text><text x="634" y="287" class="d">one HOSTED-ONLY file;</text><text x="634" y="306" class="d">weights never leave us</text><circle cx="638" cy="324" r="4" fill="none" stroke="#9299ab" stroke-width="1.5"/><text x="648" y="328" class="s" fill="#9299ab">planned</text></g>
<g data-step="deploy" data-n="4"><rect class="gf-cb" x="912" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="934" cy="256" r="12" fill="#a98bfa"/><text x="934" y="260.5" text-anchor="middle" class="n">4</text><text x="956" y="261" class="t">Deploy</text><text x="928" y="287" class="d">our GPU hosts only, one</text><text x="928" y="306" class="d">container shape</text><circle cx="932" cy="324" r="4" fill="none" stroke="#9299ab" stroke-width="1.5"/><text x="942" y="328" class="s" fill="#9299ab">planned</text></g>
<g data-step="store" data-n="5"><rect class="gf-cb" x="1206" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="1228" cy="256" r="12" fill="#a98bfa"/><text x="1228" y="260.5" text-anchor="middle" class="n">5</text><text x="1250" y="261" class="t">The storefront</text><text x="1222" y="287" class="d">you call, we think — receipts</text><text x="1222" y="306" class="d">on answers</text><circle cx="1226" cy="324" r="4" fill="none" stroke="#9299ab" stroke-width="1.5"/><text x="1236" y="328" class="s" fill="#9299ab">planned</text></g>
</svg>
