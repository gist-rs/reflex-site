# Tier 0 (Proposal 014 hosted-serving sketch): the arena site is static
# assets — zero marginal cost, zero secrets, zero bindings. The playground
# talks to the visitor's OWN localhost engine; this worker serves files and
# nothing else.
name = "reflex-site"
compatibility_date = "2026-09-01"

# The riir.ai family move (riir-dapps issue 152, 2026-10-30): the site is
# MOVING to reflex.riir.ai — every link and canonical in these pages now
# names it. PENDING the owner dashboard attach (Workers & Pages →
# reflex-site → Settings → Domains & Routes → Custom domain); until it
# lands, the old reflex.gist.rs domain still serves these same bytes, and
# the CORS rows on the API worker keep echoing both origins.
# Deliberately NOT declared here: a config `routes` block makes every
# future `wrangler deploy` require Workers Routes + DNS permission on the
# zone — neither .env token has it (measured 2026-09-22: deploy token =
# "No access to the specified resource" on /zones/.../workers/routes),
# and a dashboard-attached custom domain persists across config-less
# deploys on its own. Enable the block below ONLY if the deploy token is
# ever granted zone route permission.
#
# routes = [
#   { pattern = "reflex.riir.ai", custom_domain = true }
# ]

[assets]
directory = "./"
not_found_handling = "404-page"
