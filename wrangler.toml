# Tier 0 (Proposal 014 hosted-serving sketch): the arena site is static
# assets — zero marginal cost, zero secrets, zero bindings. The playground
# talks to the visitor's OWN localhost engine; this worker serves files and
# nothing else.
name = "reflex-site"
compatibility_date = "2026-09-01"

# ⚠ The reflex.gist.rs custom domain needs a token with Workers Routes + DNS
# permission on the gist.rs zone — neither .env token has it (measured
# 2026-09-22: deploy token = "No access to the specified resource" on
# /zones/.../workers/routes). Owner step — either grant the permission and
# re-add this block, or attach via the dashboard:
#   Workers & Pages → reflex-site → Settings → Domains & Routes → Add →
#   Custom domain → reflex.gist.rs
#
# routes = [
#   { pattern = "reflex.gist.rs", custom_domain = true }
# ]

[assets]
directory = "./"
not_found_handling = "404-page"
